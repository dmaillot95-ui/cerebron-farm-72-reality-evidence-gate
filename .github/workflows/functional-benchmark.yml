name: CEREBRON Functional Benchmark F72
on:
  push:
    paths: ['worker/functional_benchmark.py','.github/workflows/functional-benchmark.yml']
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python worker/functional_benchmark.py
      - uses: actions/upload-artifact@v4
        with: {name: f72-functional-benchmark, path: artifacts/benchmark.json}
