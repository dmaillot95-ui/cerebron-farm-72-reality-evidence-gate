name: AGORA Recursive 5m Cycle
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: agora-recursive-${{ github.repository }}
  cancel-in-progress: false
jobs:
  recursive-state:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Restore durable state
        shell: bash
        run: |
          mkdir -p .agora-state
          if [ -f agora/state.json ]; then cp agora/state.json .agora-state/state.json; fi
      - name: Build STATE(t+1)
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          p=".agora-state/state.json"
          try: parent=json.load(open(p))
          except Exception: parent={}
          state={"schema":"AGORA_RECURSIVE_STATE_V2","state_id":os.environ["GITHUB_REPOSITORY"]+":"+os.environ["GITHUB_RUN_ID"],"parent_state_id":parent.get("state_id","GENESIS"),"iteration":int(parent.get("iteration",0))+1,"resource":os.environ["GITHUB_REPOSITORY"],"residual":parent.get("nextlock","BOOTSTRAP"),"claims":[],"evidence_ids":[],"questions":[],"errors":[],"anti_error_rules":parent.get("anti_error_rules",[]),"audit":"PENDING","red_team":"PENDING","reproduction":"PENDING","reality_gate":"PENDING","ablation":"PENDING","transfer":"PENDING","decision":"HOLD","nextlock":"COLLECT_REAL_OUTPUT","rule":"WORKFLOW_EXECUTION!=LEARNING!=PROOF"}
          json.dump(state,open(p,"w"),indent=2)
          PY
          mkdir -p agora && cp .agora-state/state.json agora/state.json
      - name: Commit durable packet
        shell: bash
        run: |
          git config user.name "cerebron-agora-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agora/state.json
          git diff --cached --quiet && exit 0
          git commit -m "AGORA recursive state ${GITHUB_RUN_ID}"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: recursive-state-${{ github.run_id }}
          path: agora/state.json
          retention-days: 14
