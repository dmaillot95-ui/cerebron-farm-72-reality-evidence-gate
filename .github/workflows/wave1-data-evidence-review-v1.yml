name: F72 Wave1 Data Evidence Review V1
on:
  push:
    branches: [main]
    paths:
      - 'requests/wave1-data-evidence-review-v1.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile F72 Wave1 data review
        run: python -m py_compile worker/wave1_data_evidence_review_v1.py
      - name: Run real F72 Wave1 data evidence review
        run: python worker/wave1_data_evidence_review_v1.py
      - name: Verify F72 Wave1 receipt integrity
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("artifacts/wave1-data-evidence-review-v1.json")
          d=json.loads(p.read_text())
          assert d["farm_id"]==72
          assert d["review_pass"] is True
          assert d["evidence_status"]=="SUPPORTED"
          assert d["evidence_level"]=="E2"
          assert d["training_released"] is False
          assert d["decision"]=="F72_SUPPORTS_SYNTHETIC_CANDIDATE_POOL_ADMISSION"
          assert d["route"]=="AFAH_WAVE1_DATA_ADMISSION_REVIEW"
          assert d["manifest_sha256"]=="4fe279c2941b324d1a7fb2620bff945aa6558c7596aa5814ac4802d55ac36abe"
          assert all(d["checks"].values())
          assert len(d["result_sha256"])==64
          print("F72_WAVE1_DATA_REVIEW=PASS",d["result_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f72-wave1-data-evidence-review-${{ github.run_id }}
          path: artifacts/wave1-data-evidence-review-v1.json
          if-no-files-found: error
      - name: Persist F72 Wave1 review receipt
        run: |
          mkdir -p receipts
          cp artifacts/wave1-data-evidence-review-v1.json receipts/wave1-data-evidence-review-${{ github.run_id }}.json
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/wave1-data-evidence-review-${{ github.run_id }}.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: F72 Wave1 data evidence review ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
