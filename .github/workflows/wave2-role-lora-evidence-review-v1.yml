name: F72 Wave2 Role LoRA Evidence Review V1
on:
  push:
    branches: [main]
    paths:
      - 'requests/wave2-role-lora-evidence-review-v1.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile generic Wave2 model review
        run: python -m py_compile worker/wave2_role_lora_evidence_review_v1.py
      - name: Run real F72 Wave2 candidate review
        run: python worker/wave2_role_lora_evidence_review_v1.py
      - name: Verify F72 receipt
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path("artifacts/wave2-role-lora-evidence-review-v1.json").read_text())
          assert d["farm_id"]==72
          assert d["all_requested_candidates_pass"] is True
          assert d["candidate_adapters_used_for_review"] is False
          assert d["training_released"] is False
          assert all(v["review_pass"] for v in d["results"].values())
          print("F72_WAVE2_ROLE_LORA_REVIEW=PASS",d["result_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f72-wave2-role-lora-review-${{ github.run_id }}
          path: artifacts/wave2-role-lora-evidence-review-v1.json
          if-no-files-found: error
      - name: Persist Wave2 role LoRA review
        run: |
          mkdir -p receipts
          cp artifacts/wave2-role-lora-evidence-review-v1.json receipts/wave2-role-lora-evidence-review-${{ github.run_id }}.json
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/wave2-role-lora-evidence-review-${{ github.run_id }}.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: F72 Wave2 role LoRA review ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
